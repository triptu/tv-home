plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        // The launcher is sideloaded over ADB, never published to Google Play, so Play's minimum targetSdk
        // does not apply; without this, lintVitalRelease fails assembleRelease.
        disable 'ExpiredTargetSdkVersion'
    }

    testOptions {
        unitTests.all {
            systemProperty 'inkSheet', project.findProperty('inkSheet') ?: ''
            testLogging.showStandardStreams = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    testImplementation 'junit:junit:4.13.2'
}

// The ink test reads and draws pictures with javax.imageio and java.awt, which android.jar and the trimmed
// JDK image the Android plugin compiles against leave out, so the unit test compile sees the whole JDK.
tasks.withType(JavaCompile).configureEach {
    if (name.contains('UnitTest')) {
        doFirst {
            options.bootstrapClasspath = null
            options.compilerArgumentProviders.removeIf { it.class.simpleName == 'JdkImageInput' }
        }
    }
}
